name: Daily Henri - Real Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install gTTS moviepy pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run Real Factory
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline_defs/mental_etudiant_henri.py --config pipeline_defs/mental_etudiant_henri.yaml
      - name: Check Output
        run: |
          ls -lh output/ || ls -lh *.mp4 || echo "no video"
      - name: Upload Henri Factory Files
        uses: actions/upload-artifact@v4
        with:
          name: henri-video-complet
          path: output/
          if-no-files-found: warn
